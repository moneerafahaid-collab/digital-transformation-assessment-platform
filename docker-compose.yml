services:
  postgres:
    image: postgres:16-alpine
    container_name: dtap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dtap
      POSTGRES_PASSWORD: dtap_secret
      POSTGRES_DB: dtap
    ports:
      - "5432:5432"
    volumes:
      - dtap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtap -d dtap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dtap_pg_data:
